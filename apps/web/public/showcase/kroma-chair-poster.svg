<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Kroma Ergonomic Lounge Chair fallback poster">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#192028"/>
      <stop offset="55%" stop-color="#0c1015"/>
      <stop offset="100%" stop-color="#08090b"/>
    </radialGradient>
    <linearGradient id="cushion" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d3744"/>
      <stop offset="60%" stop-color="#182029"/>
      <stop offset="100%" stop-color="#11161d"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9d2dd"/>
      <stop offset="50%" stop-color="#7a8795"/>
      <stop offset="100%" stop-color="#46515f"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity=".9" transform="translate(800 480)">
    <!-- Floor shadow -->
    <ellipse cx="0" cy="220" rx="320" ry="45" fill="#000" opacity=".5"/>
    
    <!-- 5-Star Base & Casters -->
    <path d="M-220 200 L0 180 L220 200 M-140 220 L0 180 L140 220" stroke="url(#metal)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="-220" cy="205" r="14" fill="#14181f" stroke="#6b7787" stroke-width="3"/>
    <circle cx="220" cy="205" r="14" fill="#14181f" stroke="#6b7787" stroke-width="3"/>
    <circle cx="-140" cy="225" r="14" fill="#14181f" stroke="#6b7787" stroke-width="3"/>
    <circle cx="140" cy="225" r="14" fill="#14181f" stroke="#6b7787" stroke-width="3"/>
    
    <!-- Pneumatic stem & mechanism -->
    <rect x="-18" y="100" width="36" height="85" rx="6" fill="url(#metal)"/>
    <rect x="-60" y="80" width="120" height="30" rx="6" fill="#1e252f" stroke="#485363" stroke-width="3"/>
    
    <!-- Seat Cushion -->
    <path d="M-150 70 Q0 85 150 70 L140 40 Q0 50 -140 40 Z" fill="url(#cushion)" stroke="#4d5c6f" stroke-width="4"/>
    
    <!-- Armrests -->
    <path d="M-170 30 L-170 -10 Q-170 -30 -140 -30 L-100 -30" fill="none" stroke="url(#metal)" stroke-width="12" stroke-linecap="round"/>
    <path d="M170 30 L170 -10 Q170 -30 140 -30 L100 -30" fill="none" stroke="url(#metal)" stroke-width="12" stroke-linecap="round"/>
    <rect x="-175" y="-38" width="90" height="14" rx="7" fill="#151b22"/>
    <rect x="85" y="-38" width="90" height="14" rx="7" fill="#151b22"/>

    <!-- Spine -->
    <rect x="-14" y="-220" width="28" height="300" rx="8" fill="url(#metal)"/>
    
    <!-- Backrest & Lumbar -->
    <path d="M-120 30 Q-135 -60 -115 -140 Q-90 -220 0 -220 Q90 -220 115 -140 Q135 -60 120 30 Q0 45 -120 30 Z" fill="url(#cushion)" stroke="#4d5c6f" stroke-width="4"/>
    <rect x="-80" y="-80" width="160" height="45" rx="14" fill="#12171e" stroke="#617388" stroke-width="3"/>

    <!-- Headrest -->
    <path d="M-75 -245 Q0 -265 75 -245 L70 -290 Q0 -305 -70 -290 Z" fill="url(#cushion)" stroke="#4d5c6f" stroke-width="4"/>
  </g>
  <text x="70" y="90" fill="#dce3ea" font-family="Arial, sans-serif" font-size="22" letter-spacing="8">SHOWCASE ENGINE V1 / VERTICAL 02</text>
  <text x="70" y="835" fill="#727e8b" font-family="Arial, sans-serif" font-size="18" letter-spacing="4">LOADING KROMA LOUNGE CHAIR 3D ASSET</text>
</svg>
