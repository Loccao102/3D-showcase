name: CI

on:
  push:
    branches:
      - foundation/automotive-commerce
      - "feature/**"
  pull_request:
    branches:
      - main
      - foundation/automotive-commerce

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install KTX encoder
        run: |
          curl --fail --location --retry 3 \
            https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.deb \
            --output "$RUNNER_TEMP/ktx-software.deb"
          echo "ca635ed489d8bf54fac8d7687056c651193de0740830a7738cc034adc63e3027  $RUNNER_TEMP/ktx-software.deb" | sha256sum --check
          sudo apt-get install -y "$RUNNER_TEMP/ktx-software.deb"
          ktx --version

      - name: Validate showcase assets
        run: pnpm validate:assets:production

      - name: Typecheck
        run: pnpm typecheck

      - name: Build web with KTX2 runtime assets
        env:
          NEXT_PUBLIC_SHOWCASE_ASSET_ENCODING: ktx2
        run: pnpm --filter @showcase/web build

      - name: Install Chromium smoke browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke test KTX2 delivery
        timeout-minutes: 3
        run: pnpm smoke:browser:ktx2

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: false

      - name: Resolve modules
        run: go mod tidy

      - name: Test
        run: go test ./...
