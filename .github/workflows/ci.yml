name: CI

on:
  push:
    branches:
      - foundation/automotive-commerce
      - "feature/**"
  pull_request:
    branches:
      - main
      - foundation/automotive-commerce

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install KTX encoder
        run: |
          curl --fail --location --retry 3 \
            https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.deb \
            --output "$RUNNER_TEMP/ktx-software.deb"
          echo "ca635ed489d8bf54fac8d7687056c651193de0740830a7738cc034adc63e3027  $RUNNER_TEMP/ktx-software.deb" | sha256sum --check
          sudo apt-get install -y "$RUNNER_TEMP/ktx-software.deb"
          ktx --version

      - name: Install Meshopt encoder
        run: |
          curl --fail --location --retry 3 \
            https://github.com/zeux/meshoptimizer/releases/download/v1.2/gltfpack-ubuntu.zip \
            --output "$RUNNER_TEMP/gltfpack.zip"
          echo "ebc236f5f6c08c7e5c5750476a187d24805d44d8c680449c4b7369c333f817b1  $RUNNER_TEMP/gltfpack.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/gltfpack.zip" -d "$RUNNER_TEMP/gltfpack"
          GLTFPACK_BIN="$(find "$RUNNER_TEMP/gltfpack" -type f -name gltfpack | head -n 1)"
          test -n "$GLTFPACK_BIN"
          sudo install -m 0755 "$GLTFPACK_BIN" /usr/local/bin/gltfpack
          gltfpack -h >/dev/null

      - name: Validate showcase assets
        run: pnpm validate:assets:production

      - name: Typecheck
        run: pnpm typecheck

      - name: Build web with KTX2 + Meshopt runtime assets
        env:
          NEXT_PUBLIC_SHOWCASE_ASSET_ENCODING: ktx2
          NEXT_PUBLIC_SHOWCASE_MESHOPT: "1"
        run: pnpm --filter @showcase/web build

      - name: Browser smoke test KTX2 + Meshopt delivery
        timeout-minutes: 3
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
          SHOWCASE_EXPECT_MESHOPT: "1"
        run: pnpm smoke:browser:runtime

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: false

      - name: Resolve modules
        run: go mod tidy

      - name: Test
        run: go test ./...
